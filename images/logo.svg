<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#FDF0CD" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFE082" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Luxury Monogram Crest -->
  <g transform="translate(15, 12)">
    <!-- Outer Octagon / Diamond Border -->
    <circle cx="48" cy="48" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="1 3"/>
    <circle cx="48" cy="48" r="40" fill="#141110" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="48" cy="48" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>

    <!-- Decorative Stars -->
    <path d="M 48 14 L 49.5 21 L 56 22.5 L 49.5 24 L 48 31 L 46.5 24 L 40 22.5 L 46.5 21 Z" fill="url(#goldGrad)"/>
    <path d="M 48 65 L 49.5 72 L 56 73.5 L 49.5 75 L 48 82 L 46.5 75 L 40 73.5 L 46.5 72 Z" fill="url(#goldGrad)"/>

    <!-- Letter 'T' Luxury Typography -->
    <text x="48" y="58" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="36" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" filter="url(#shadow)">T</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 20)">
    <!-- Main Brand Name -->
    <text x="0" y="44" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="34" font-weight="700" letter-spacing="4" fill="url(#goldGrad)" filter="url(#shadow)">
      THILOTHANA
    </text>
    
    <!-- Divider Line with Diamond -->
    <line x1="2" y1="58" x2="135" y2="58" stroke="url(#goldGrad)" stroke-width="1" opacity="0.7"/>
    <polygon points="145,58 148,54 151,58 148,62" fill="url(#goldGrad)"/>
    <line x1="160" y1="58" x2="310" y2="58" stroke="url(#goldGrad)" stroke-width="1" opacity="0.7"/>

    <!-- Subtitle / Tagline -->
    <text x="2" y="78" font-family="'Montserrat', 'Outfit', sans-serif" font-size="11" font-weight="600" letter-spacing="4.5" fill="#E8D5B5">
      LUXURY BRIDAL &amp; CELEBRITY MAKEUP
    </text>
  </g>
</svg>
