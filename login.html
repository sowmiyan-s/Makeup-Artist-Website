<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/fav.png" type="image/png">
    <title>Admin Portal Login | Thilothana Makeup Artist</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-card">
        <div class="logo-area">
            <img src="images/logo.png" alt="Thilothana Makeup Artist">
        </div>
        <h2>Admin Portal</h2>
        <div class="subtitle">Secure Management Access</div>

        <p id="loginError" class="error-text"><i class="fa fa-exclamation-circle"></i> Invalid credentials. Please try again.</p>

        <form id="adminLoginForm" onsubmit="handleLoginSubmit(event)">
            <div class="form-group">
                <label for="loginUsername">Admin Username</label>
                <input type="text" id="loginUsername" placeholder="Enter username" required value="admin">
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required value="admin123">
            </div>
            <button type="submit"><i class="fa fa-lock"></i> Access Dashboard</button>
        </form>

        <a href="index.html" class="back-link"><i class="fa fa-arrow-left"></i> Return to Main Website</a>
    </div>

    <script src="js/db.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
