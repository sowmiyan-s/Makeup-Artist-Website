<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/fav.png" type="images/fav.png">
    <title>Admin Login</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Body */
        body {
            background-color: #fff; /* White background */
            color: #333; /* Dark text */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        /* Form Container */
        form {
            background-color: #fff; /* White */
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #eee;
        }

        h2 {
            color: #bc1939; /* Red */
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #bc1939; /* Red */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #e5554f; /* Darker red */
        }

        p.error-text {
            color: #f44336; /* Error message in red */
            margin-bottom: 15px;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #bc1939;
        }
    </style>
</head>
<body>
    <form id="adminLoginForm" onsubmit="handleLoginSubmit(event)">
        <h2>Admin Login</h2>
        <p id="loginError" class="error-text">Invalid username or password.</p>
        <input type="text" id="loginUsername" placeholder="Username" required value="admin">
        <input type="password" id="loginPassword" placeholder="Password" required value="admin123">
        <button type="submit">Login</button>
        <a href="index.html" class="back-link">← Back to Website</a>
    </form>

    <script src="js/db.js"></script>
    <script>
        if (DB.isAdminLoggedIn()) {
            window.location.href = 'admin.html';
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            var u = document.getElementById('loginUsername').value.trim();
            var p = document.getElementById('loginPassword').value.trim();

            if (DB.loginAdmin(u, p)) {
                window.location.href = 'admin.html';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }
    </script>
</body>
</html>
