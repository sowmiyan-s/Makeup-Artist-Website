<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/fav.png" type="image/png">
    <title>Admin Portal Login | Thilothana Makeup Artist</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f0a12 0%, #30101d 50%, #15060c 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            color: #211016;
            padding: 42px 36px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(188, 25, 57, 0.25);
            position: relative;
        }

        .login-card .logo-area img {
            max-height: 48px;
            margin: 0 auto 16px;
            display: block;
        }

        h2 {
            font-family: 'Playfair Display', Georgia, serif;
            color: #211016;
            margin-bottom: 6px;
            font-size: 1.85rem;
            font-weight: 700;
        }

        .subtitle {
            font-size: 13px;
            color: #8a7078;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a343b;
            margin-bottom: 6px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e5d4d9;
            border-radius: 8px;
            font-size: 15px;
            color: #211016;
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #bc1939;
            box-shadow: 0 0 0 3px rgba(188, 25, 57, 0.15);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #bc1939;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(188, 25, 57, 0.35);
        }

        button:hover {
            background: #9b132d;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(188, 25, 57, 0.45);
        }

        p.error-text {
            color: #dc3545;
            background: #ffe6e9;
            padding: 10px;
            border-radius: 6px;
            font-size: 13.5px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid rgba(220, 53, 69, 0.2);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 22px;
            color: #7a666e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #bc1939;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-area">
            <img src="images/logo.png" alt="Thilothana Makeup Artist">
        </div>
        <h2>Admin Portal</h2>
        <div class="subtitle">Secure Management Access</div>

        <p id="loginError" class="error-text"><i class="fa fa-exclamation-circle"></i> Invalid credentials. Please try again.</p>

        <form id="adminLoginForm" onsubmit="handleLoginSubmit(event)">
            <div class="form-group">
                <label for="loginUsername">Admin Username</label>
                <input type="text" id="loginUsername" placeholder="Enter username" required value="admin">
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required value="admin123">
            </div>
            <button type="submit"><i class="fa fa-lock"></i> Access Dashboard</button>
        </form>

        <a href="index.html" class="back-link"><i class="fa fa-arrow-left"></i> Return to Main Website</a>
    </div>

    <script src="js/db.js"></script>
    <script>
        if (DB.isAdminLoggedIn()) {
            window.location.href = 'admin.html';
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            var u = document.getElementById('loginUsername').value.trim();
            var p = document.getElementById('loginPassword').value.trim();

            if (DB.loginAdmin(u, p)) {
                window.location.href = 'admin.html';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }
    </script>
</body>
</html>
